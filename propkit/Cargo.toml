[package]
name = "propkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable proptest property suites ported from Hypothesis"

[features]
default = []
strategies = ["dep:proptest"]
chrono = ["strategies", "dep:chrono"]
complex = ["strategies", "dep:num-complex"]
regex = ["strategies", "dep:regex"]
uuid = ["strategies", "dep:uuid"]

[dependencies]
proptest = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
num-complex = { version = "0.4", optional = true }
regex = { version = "1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
chrono = "0.4"
num-complex = "0.4"
proptest = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "floats"
required-features = ["strategies"]

[[test]]
name = "permutations"
required-features = ["strategies"]

[[test]]
name = "slices"
required-features = ["strategies"]

[[test]]
name = "recursive"
required-features = ["strategies"]

[[test]]
name = "complex"
required-features = ["complex"]

[[test]]
name = "datetimes"
required-features = ["chrono"]

[[test]]
name = "regex_props"
required-features = ["regex"]

[[test]]
name = "uuids"
required-features = ["uuid"]

[[test]]
name = "public_api"
required-features = ["strategies"]

[[test]]
name = "feature_api"
required-features = ["complex", "chrono", "regex", "uuid"]
