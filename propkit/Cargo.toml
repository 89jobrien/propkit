[package]
name = "propkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable proptest property suites ported from Hypothesis"

[features]
default = []
strategies = ["dep:proptest"]

[dependencies]
proptest = { version = "1", optional = true }

[dev-dependencies]
chrono = "0.4"
proptest = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
